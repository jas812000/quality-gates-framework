name: Framework regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-validation:
    name: GitHub Actions workflow validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Install Actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate GitHub Actions workflows
        run: '"$(go env GOPATH)/bin/actionlint" -color -shellcheck= -pyflakes='

  python-portability:
    name: Python portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install framework test dependencies
        run: python -m pip install -r quality/requirements-test.txt
      - name: Test shared utilities and discovery
        run: python -m unittest discover -s quality/shared/tests -p "test_*.py" -q
      - name: Test CI normalization and reporting
        run: python -m unittest discover -s quality/CI/tests -p "test_*.py" -q
      - name: Test local orchestration on native Python
        run: python -m unittest discover -s quality/Local_Scans/tests -p "test_*.py" -q
      - name: Verify zero-config discovery
        run: python -m quality.project_discovery --json .
  posix-launcher:
    name: POSIX launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install framework test dependencies
        run: python -m pip install -r quality/requirements-test.txt
      - name: Validate shell syntax
        shell: bash
        run: |
          sh -n quality/Local_Scans/run-local-checks.sh
          sh -n quality/Local_Scans/checks/check_checkstyle.sh
          sh -n quality/Local_Scans/checks/check_pmd.sh
          sh -n quality/Local_Scans/checks/check_spotbugs.sh
      - name: Test local orchestration
        run: python -m unittest discover -s quality/Local_Scans/tests -p "test_*.py" -q
